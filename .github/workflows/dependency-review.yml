name: Dependency review

# The repository dependency graph resolves again (issue #27), so this gate runs
# on every pull request. `pnpm audit` in ci.yml stays as the second check: this
# one reviews the diff, that one reviews the installed production tree.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, SSPL-1.0, BUSL-1.1
          comment-summary-in-pr: on-failure
